<style>
:root {
  --bg: #090d16;
  --surface: #0f172a;
  --card: #162036;
  --card-hover: #1c2a47;
  --border: #223254;
  --accent: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.15);
  --danger: #f43f5e;
  --ok: #10b981;
  --warn: #f59e0b;
  --neutral: #94a3b8;
  --text: #f1f5f9;
  --muted: #64748b;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Inter', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13.5px; line-height: 1.6; min-height: 100vh; }
.page { max-width: 1440px; margin: 0 auto; padding: 32px 24px 80px; }

/* Header */
.hdr { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
.hdr h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 6px; color: #fff; }
.hdr p { color: var(--muted); font-size: 12.5px; max-width: 900px; }
.badge { background: #0c1c38; border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; padding: 6px 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; white-space: nowrap; }

/* Asset Selector Tabs */
.nav-assets { display: flex; gap: 6px; margin-bottom: 28px; background: var(--surface); padding: 6px; border-radius: 10px; border: 1px solid var(--border); overflow-x: auto; }
.asset-tab { flex: 1; min-width: 140px; padding: 12px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; text-align: center; background: transparent; color: var(--muted); border: 1px solid transparent; transition: all 0.2s; }
.asset-tab:hover { color: var(--text); background: rgba(255,255,255,0.03); }
.asset-tab.active { background: var(--card); color: #fff; border-color: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }

/* Panels */
.panel { display: none; }
.panel.active { display: block; }

/* Section styling */
.sec-title { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
.sec-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.section { margin-bottom: 36px; }

/* 4-Card Summary Grid */
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px 18px; position: relative; overflow: hidden; }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.c-is-raw::before { background: #3b82f6; }
.c-is-mac::before { background: #10b981; }
.c-oos-raw::before { background: #f59e0b; }
.c-oos-mac::before { background: #f43f5e; }

.clabel { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.cbig { font-size: 24px; font-weight: 800; font-family: var(--mono); margin-bottom: 4px; }
.csub { font-size: 11.5px; color: var(--muted); margin-bottom: 12px; }
.crow { display: flex; justify-content: space-between; font-size: 11.5px; padding: 3px 0; border-top: 1px solid rgba(255,255,255,0.03); }
.crow span:first-child { color: var(--muted); }
.crow span:last-child { font-family: var(--mono); font-weight: 600; }

.pos { color: var(--ok); }
.neg { color: var(--danger); }
.neu { color: var(--neutral); }

/* Table styling */
.tbl-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; margin-bottom: 24px; }
.tbl-hdr { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.tbl-hdr h3 { font-size: 13.5px; font-weight: 700; color: #fff; }
.tbl-hdr span { font-size: 11.5px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; min-width: 900px; }
thead tr { background: #0c1322; }
th { padding: 10px 14px; text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
th.r, td.r { text-align: right; }
tbody tr { border-top: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
tbody tr:hover { background: rgba(255,255,255,0.025); }
td { padding: 10px 14px; font-size: 12px; font-family: var(--mono); white-space: nowrap; }
td.lbl { font-family: var(--sans); font-weight: 600; font-size: 12.5px; }

/* Delta Badge */
.d-pill { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; font-family: var(--sans); }
.d-good { background: rgba(16,185,129,0.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
.d-bad { background: rgba(244,63,94,0.15); color: #fda4af; border: 1px solid rgba(244,63,94,0.3); }
.d-neu { background: rgba(148,163,184,0.1); color: #cbd5e1; }

/* Charts area */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
.chart-card h3 { font-size: 13.5px; font-weight: 700; margin-bottom: 4px; color: #fff; }
.chart-card p { font-size: 11.5px; color: var(--muted); margin-bottom: 16px; }
.chart-h { position: relative; height: 260px; }

/* Narrative Box */
.narrative { background: linear-gradient(135deg, #0d162a 0%, #111e38 100%); border: 1px solid #1e3a6d; border-radius: 10px; padding: 24px 28px; margin-top: 24px; }
.narrative h4 { font-size: 14px; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
.narrative p { font-size: 13px; line-height: 1.7; color: #cbd5e1; margin-bottom: 8px; }
.narrative p:last-child { margin-bottom: 0; }

@media (max-width: 1024px) {
  .grid4 { grid-template-columns: 1fr 1fr; }
  .grid2 { grid-template-columns: 1fr; }
}
</style>

function fmt(v, dec=2) {
  if (v == null || isNaN(v)) return '—';
  return (v >= 0 ? '$' : '−$') + Math.abs(v).toFixed(dec);
}
function fmtN(v) { return v != null ? v.toLocaleString() : '—'; }
function cls(v) { return v == null ? 'neu' : (v >= 0 ? 'pos' : 'neg'); }

function renderAssetCharts(asset, aData) {
  if (activeChart1) activeChart1.destroy();
  if (activeChart2) activeChart2.destroy();
  
  const slotLabels = aData.slots.map(s => `${s.day} ${s.bucket}`);
  const rawMeans = aData.slots.map(s => s.oos_raw.mean);
  const macMeans = aData.slots.map(s => s.oos_macro.mean);
  
  // Bar Chart
  const ctx1 = document.getElementById('chart-slot-bars');
  if (ctx1) {
    activeChart1 = new Chart(ctx1, {
      type: 'bar',
      data: {
        labels: slotLabels,
        datasets: [
          { label: 'OOS Raw Baseline', data: rawMeans, backgroundColor: 'rgba(245, 158, 11, 0.6)', borderColor: '#f59e0b', borderWidth: 1 },
          { label: 'OOS +Macro Filter', data: macMeans, backgroundColor: 'rgba(244, 63, 94, 0.7)', borderColor: '#f43f5e', borderWidth: 1 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#94a3b8', font: { size: 11 } } } },
        scales: {
          x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } },
          y: { ticks: { color: '#64748b', callback: v => '$' + v }, grid: { color: 'rgba(255,255,255,0.04)' } }
        }
      }
    });
  }

  // Cumulative Line Chart
  const ctx2 = document.getElementById('chart-cum-curve');
  if (ctx2) {
    const oosMonths = aData.monthly.oos_raw.map(m => m.month);
    const rawCum = aData.monthly.oos_raw.map(m => m.cum);
    const macCum = aData.monthly.oos_macro.map(m => m.cum);
    
    activeChart2 = new Chart(ctx2, {
      type: 'line',
      data: {
        labels: oosMonths,
        datasets: [
          { label: 'Raw Holdout Cumulative', data: rawCum, borderColor: '#f59e0b', tension: 0.3, pointRadius: 3 },
          { label: '+Macro Filter Cumulative', data: macCum, borderColor: '#f43f5e', tension: 0.3, pointRadius: 3 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#94a3b8', font: { size: 11 } } } },
        scales: {
          x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } },
          y: { ticks: { color: '#64748b', callback: v => '$' + (v/1000).toFixed(0) + 'k' }, grid: { color: 'rgba(255,255,255,0.04)' } }
        }
      }
    });
  }
}

function switchAsset(asset, btn) {
  document.querySelectorAll('.asset-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderAsset(asset);
}

// Initial render
renderAsset('ALL');
</script>
</body>
